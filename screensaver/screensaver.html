<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bezier</title>
    <script src="p5.min.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script>
    const NUM_ANCHORS = 4;
    const NUM_GHOSTS  = 12;
    const SPEED       = 2.5;

    let controlPoints = [];

    class Joint {
        constructor(x, y) {
            this.pos = createVector(x, y);
            const angle = random(TWO_PI);
            this.vel = createVector(cos(angle), sin(angle)).mult(2);
            this.history = [];
        }

        update() {
            this.pos.add(p5.Vector.mult(this.vel, SPEED));
            this.history.push(this.pos.copy());
            if (this.history.length > NUM_GHOSTS * 2) this.history.shift();

            if (this.pos.x < 0 || this.pos.x > width) {
                this.vel.x *= -1;
                this.pos.x = constrain(this.pos.x, 0, width);
            }
            if (this.pos.y < 0 || this.pos.y > height) {
                this.vel.y *= -1;
                this.pos.y = constrain(this.pos.y, 0, height);
            }
        }
    }

    // Returns midpoint anchors from an array of p5.Vector control positions.
    function computeAnchors(cps) {
        const result = [];
        for (let i = 0; i < cps.length; i += 2) {
            result.push(p5.Vector.add(cps[i], cps[(i + 1) % cps.length]).div(2));
        }
        return result;
    }

    function drawBezier(cps, alpha, weight) {
        const anchors = computeAnchors(cps);
        stroke(211, 7, 252, alpha);
        strokeWeight(weight);
        noFill();
        beginShape();
        vertex(anchors[0].x, anchors[0].y);
        for (let i = 0; i < NUM_ANCHORS; i++) {
            const cp1    = cps[i * 2 + 1];
            const cp2    = cps[(i * 2 + 2) % cps.length];
            const anchor = anchors[(i + 1) % NUM_ANCHORS];
            bezierVertex(cp1.x, cp1.y, cp2.x, cp2.y, anchor.x, anchor.y);
        }
        endShape();
    }

    function setup() {
        createCanvas(windowWidth, windowHeight);
        for (let i = 0; i < NUM_ANCHORS * 2; i++) {
            controlPoints.push(new Joint(
                random(width * 0.2, width * 0.8),
                random(height * 0.2, height * 0.8)
            ));
        }
    }

    function draw() {
        background(0);
        for (const cp of controlPoints) cp.update();

        const positions = controlPoints.map(cp => cp.pos);

        // Ghost trails — oldest drawn first so recent ghosts layer on top
        for (let g = 0; g < NUM_GHOSTS; g++) {
            const alpha = map(g, 0, NUM_GHOSTS, 150, 40);
            const delay = (g + 1) * 2;
            if (!controlPoints.every(cp => cp.history.length > delay)) continue;
            const ghostPos = controlPoints.map(cp => cp.history[cp.history.length - delay - 1]);
            drawBezier(ghostPos, alpha, 2);
        }

        drawBezier(positions, 255, 2.5);
    }

    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
    }
</script>
</body>
</html>
